name: Doomsday Protocol CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Latverian Archives
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Clean Install (Rebuild Native Bindings)
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional --legacy-peer-deps

      - name: Verify Multiverse Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Security & Linter Check
        run: npm run lint --if-present

      - name: Protocol Verification Complete
        run: echo "Reality index stable. For all time. Always."
